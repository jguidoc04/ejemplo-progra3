<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinilo - Tienda de discos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
            background-color: #f5f5f5;
        }

        header {
            padding: 25px;
            background-color: #ffe4b5;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 15px;
            background-color: #cce0ff;
        }

        nav a {
            color: #222;
            text-decoration: none;
        }

        .presentacion {
            padding: 40px 20px;
            background-color: #d5eddf;
            text-align: center;
        }

        .boton {
            display: inline-block;
            padding: 12px 20px;
            background-color: #e84060;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .catalogo {
            padding: 25px;
            background-color: #ffe0e8;
        }

        .productos {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .tarjeta {
            width: 220px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            text-align: center;
        }

        .portada {
            padding: 30px;
            background-color: #eee;
            border-radius: 6px;
            font-size: 50px;
        }

        footer {
            padding: 20px;
            background-color: #ded8ff;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Encabezado -->
    <header id="inicio">
        <h1>💿 Vinilo</h1>
        <p>Tienda de discos</p>
    </header>

    <!-- Menú de navegación -->
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#discos">Discos</a>
        <a href="#contacto">Contacto</a>
    </nav>

    <!-- Contenido principal -->
    <main>
        <section class="presentacion">
            <h2>Encuentra tu próximo disco</h2>
            <p>Explora nuestra selección de música.</p>
            <a href="#discos" class="boton">Ver catálogo</a>
        </section>

        <!-- Tarjetas de productos -->
        <section id="discos" class="catalogo">
            <h2>Discos disponibles</h2>

            <div class="productos">
                <article class="tarjeta">
                    <div class="portada">💿</div>
                    <h3>Horizontes</h3>
                    <p>Indie</p>
                    <p><strong>₡12 000</strong></p>
                </article>

                <article class="tarjeta">
                    <div class="portada">🎸</div>
                    <h3>Ecos</h3>
                    <p>Rock</p>
                    <p><strong>₡14 000</strong></p>
                </article>

                <article class="tarjeta">
                    <div class="portada">🎷</div>
                    <h3>Raíces</h3>
                    <p>Jazz</p>
                    <p><strong>₡13 000</strong></p>
                </article>
            </div>
        </section>
    </main>

    <!-- Pie de página -->
    <footer id="contacto">
        <p>Contacto: info@vinilo.example</p>
        <p>Vinilo — Tienda de discos</p>
    </footer>
</body>
</html>
